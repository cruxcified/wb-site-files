/* =====================================================================
   9. FOUNTAIN / MARKDOWN
   ===================================================================== */
function toFountain(list, title, md, tp){
  const out = [];
  if (hasTitlePage(tp)){                      // Fountain title page block
    const kv = [['Title', tp.title], ['Credit', tp.credit], ['Author', tp.author], ['Source', tp.source], ['Draft date', tp.date]]
      .filter(([, v]) => (v || '').trim()).map(([k, v]) => `${k}: ${v.trim()}`);
    const contact = (tp.contact || '').split('\n').map(x => x.trim()).filter(Boolean);
    if (contact.length) kv.push('Contact:\n' + contact.map(c => '    ' + c).join('\n'));
    out.push(kv.join('\n'));
  } else if (title) out.push(md ? '# ' + title : 'Title: ' + title);
  let speech = null;
  const flush = () => { if (speech){ out.push(speech.join('\n')); speech = null; } };
  for (const [t, raw] of list){
    const x = raw.replace(/\s+/g, ' ').trim(); if (!x || (t === 'paren' && !x.replace(/[()\s]/g, ''))) continue;
    if (t === 'character'){ flush(); let s = x.toUpperCase(); if (!/[A-Z]/.test(s)) s = '@' + s; speech = [s]; continue; }
    if (t === 'paren' || t === 'dialogue'){
      const s = t === 'paren' ? (/^\(.*\)$/.test(x) ? x : '(' + x.replace(/^\(|\)$/g, '') + ')') : x;
      if (speech) speech.push(s); else out.push(s); continue;
    }
    flush();
    if (t === 'scene'){ const s = x.toUpperCase(); out.push(SCENE_RE.test(s + ' ') ? s : '.' + s); }
    else if (t === 'transition'){ const s = x.toUpperCase(); out.push(/TO:$/.test(s) ? s : '> ' + s); }
    else {   // action: force it with ! where Fountain would read it as something else
      const caps = /[A-Z]/.test(x) && !/[a-z]/.test(x);
      out.push((/^[.>@~=#!]|^\[\[/.test(x) || SCENE_RE.test(x + ' ') || (caps && / TO:$/.test(x)) ? '!' : '') + x);
    }
  }
  flush();
  return out.join('\n\n') + '\n';
}

// Fountain-ish parser; also does the job for plain pasted text that uses caps for cues.
function parseFountain(src){
  let text = src.replace(/\r\n?/g, '\n').replace(/\/\*[\s\S]*?\*\//g, '').replace(/\[\[[\s\S]*?\]\]/g, '');
  const L = text.split('\n'), out = []; let i = 0, title = null, tp = null;
  if (/^\s*(title|credit|author|authors|source|draft date|date|contact|notes|copyright)\s*:/i.test(L[0] || '')){
    // title page: "Key: value", with indented lines continuing the previous key
    const KEYS = { title: 'title', credit: 'credit', author: 'author', authors: 'author', source: 'source', 'draft date': 'date', date: 'date', contact: 'contact' };
    tp = { on: true }; let key = null;
    for (; i < L.length && L[i].trim() !== ''; i++){
      const m = L[i].match(/^\s*([A-Za-z ]+?)\s*:\s*(.*)$/);
      const clean = v => v.trim().replace(/[_*]/g, '');
      if (m && !/^\s{2,}|^\t/.test(L[i])){ key = KEYS[m[1].toLowerCase()] || null; if (key && clean(m[2])) tp[key] = (tp[key] ? tp[key] + '\n' : '') + clean(m[2]); }
      else if (key) tp[key] = (tp[key] ? tp[key] + (key === 'contact' ? '\n' : ' ') : '') + clean(L[i]);
    }
    title = tp.title ? tp.title.replace(/\n/g, ' ') : null;
  }
  const caps = s => { const b = s.replace(/\(.*?\)/g, ''); return /[A-Z]/.test(b) && !/[a-z]/.test(b); };
  let inSpeech = false;
  const push = (t, x) => {
    const last = out[out.length - 1];
    if (t === 'action' && last && last[0] === 'action' && last.glue){ last[1] += ' ' + x; return; }
    const e = [t, x]; e.glue = t === 'action'; out.push(e);
  };
  for (; i < L.length; i++){
    const line = L[i].trim(), prevBlank = i === 0 || !L[i - 1].trim(), nextBlank = i + 1 >= L.length || !L[i + 1].trim();
    if (!line){ inSpeech = false; if (out.length) out[out.length - 1].glue = false; continue; }
    if (inSpeech){
      if (/^\(.*\)$/.test(line)) out.push(['paren', line]);
      else if (/^\(/.test(line) && !/\)$/.test(line)){ let s = line; while (i + 1 < L.length && L[i + 1].trim() && !/\)$/.test(s)) s += ' ' + L[++i].trim(); out.push(['paren', s]); }
      else out.push(['dialogue', line]);
      continue;
    }
    if (/^#/.test(line) || /^=(?!=)/.test(line) || /^={3,}$/.test(line)) continue;      // sections, synopses, page breaks
    if (/^!/.test(line)){ push('action', line.slice(1).trim()); continue; }
    if (/^\.[^.]/.test(line)){ out.push(['scene', line.slice(1).trim()]); continue; }
    if (prevBlank && SCENE_RE.test(line + ' ')){ out.push(['scene', line.replace(/\s*#[^#]*#\s*$/, '')]); continue; }
    if (/^>.*<$/.test(line)){ push('action', line.slice(1, -1).trim()); continue; }
    if (/^>/.test(line)){ out.push(['transition', line.slice(1).trim()]); continue; }
    if (prevBlank && nextBlank && caps(line) && (/TO:$/.test(line) || TRANSITIONS.includes(line))){ out.push(['transition', line]); continue; }
    if (prevBlank && !nextBlank && (/^@/.test(line) || caps(line)) && !/^(FADE IN:?|THE END\.?)$/.test(line)){
      out.push(['character', line.replace(/^@/, '').replace(/\s*\^$/, '').trim()]); inSpeech = true; continue;
    }
    push('action', line);
  }
  return { title, tp, els: out.map(e => [e[0], e[1]]) };
}

// Plain text with screenplay indentation (e.g. a .txt export): infer types from the indent.
function parseIndented(src){
  const L = src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
  const ind = l => l.match(/^ */)[0].length;
  const base = Math.min(...L.filter(l => l.trim()).map(ind));
  const caps = s => { const b = s.replace(/\(.*?\)/g, ''); return /[A-Z]/.test(b) && !/[a-z]/.test(b); };
  const out = []; let joinable = false;
  for (const raw of L){
    const s = raw.trim();
    if (!s){ joinable = false; continue; }
    if (/^\d+\.?$/.test(s) || /^\(MORE\)$/i.test(s)) continue;          // page numbers, (MORE)
    const rel = ind(raw) - base;
    let t;
    if (rel >= 30 && caps(s)) t = 'transition';
    else if (rel >= 18 && caps(s)) t = 'character';
    else if (rel >= 6) t = /^\(/.test(s) || (joinable && out[out.length - 1][0] === 'paren' && !/\)$/.test(out[out.length - 1][1])) ? 'paren' : 'dialogue';
    else t = SCENE_RE.test(s + ' ') ? 'scene' : (caps(s) && / TO:$/.test(s) ? 'transition' : 'action');
    const last = out[out.length - 1];
    if (joinable && last && last[0] === t && (t === 'action' || t === 'dialogue' || (t === 'paren' && !/\)$/.test(last[1])))){ last[1] += ' ' + s; }
    else out.push([t, s.replace(/\s*\(CONT['’]D\)\s*$/i, t === 'character' ? '' : '$&')]);
    joinable = true;
  }
  return { title: null, els: out };
}
function parseText(src){
  const lines = src.split(/\r?\n/).filter(l => l.trim());
  const deep = lines.filter(l => /^( {8,}|\t{2,})\S/.test(l)).length;
  return lines.length >= 3 && deep / lines.length > .25 ? parseIndented(src) : parseFountain(src);
}

// Inside a claude.ai preview the page can't start downloads itself, so it asks the
// viewer through the "downloads" capability. On the Lab site it's a normal download.
let viewerDownloads = null;
const inPreview = !!(window.claude && window.claude.use);
if (inPreview) window.claude.use('downloads').then(d => { viewerDownloads = d; }, () => {});

async function download(name, data, mime = 'text/plain;charset=utf-8'){
  closePalette();
  if (inPreview){
    if (!viewerDownloads) return flash('Downloads are off in this preview');
    try { await viewerDownloads.save({ filename: name.replace(/\.fountain$/, '.fountain.txt'), data }); flash('Saved ' + name); }
    catch (e){ flash(e && e.code === 'declined' ? 'Download cancelled' : 'Downloads are off in this preview'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    flash('Saved ' + name);
  } catch (e){ flash('Download blocked here. Try "Copy as Fountain"'); }
}

/* ---------- Direct PDF: writes the paginated pages straight into a PDF file ----------
   No print dialog and no browser settings involved, so margins and page breaks are exact
   in every browser. It uses PDF's built-in Courier (the same 10-characters-per-inch
   metrics as Courier Prime), so nothing has to be embedded and the file stays tiny.
   Coordinates are PDF points (72 per inch) measured from the BOTTOM-left of the page. */
const WIN_ANSI = { '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '–': 0x96, '—': 0x97, '…': 0x85, '•': 0x95, '€': 0x80, ' ': 0x20 };
function pdfString(s){
  let out = '';
  for (const ch of s){
    let c = ch.codePointAt(0);
    if (WIN_ANSI[ch]) c = WIN_ANSI[ch]; else if (c > 255 || (c < 32)) c = 63;   // anything else becomes "?"
    const t = String.fromCharCode(c);
    out += (t === '(' || t === ')' || t === '\\') ? '\\' + t : t;
  }
  return '(' + out + ')';
}
function makePDF(pages, title, tp){
  const PT = 72, H = PAGE.h * PT, LH = PT / LPI, CHAR = PT / CPI;  // 12pt line, 7.2pt character
  const BASE = 9;                                                    // baseline sits 9pt into each 12pt line
  const textRight = (PAGE.w - PAGE.right) * PT;                      // 7.5in
  const objs = [];                                                   // objs[n-1] = body of object n
  const add = body => { objs.push(body); return objs.length; };
  const catalog = add(null), pagesObj = add(null);
  const font = add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
  const kids = [];
  const pageObj = ops => {
    ops.push('ET'); const stream = ops.join('\n');
    const content = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${PAGE.w * PT} ${H}] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${content} 0 R >>`));
  };
  if (hasTitlePage(tp)){                                             // unnumbered title page first
    const ops = ['BT', '/F1 12 Tf'];
    for (const l of titlePageLines(tp)){
      const w = l.s.length * CHAR, left = PAGE.left * PT;
      const x = l.align === 'center' ? left + (EL.action.width * PT - w) / 2 : l.align === 'right' ? textRight - w : left;
      ops.push(`1 0 0 1 ${x.toFixed(2)} ${(H - PAGE.top * PT - l.row * LH - BASE).toFixed(2)} Tm ${pdfString(l.s)} Tj`);
    }
    pageObj(ops);
  }
  pages.forEach((pg, n) => {
    const ops = ['BT', '/F1 12 Tf'];
    const put = (x, topY, str) => ops.push(`1 0 0 1 ${x.toFixed(2)} ${(H - topY - BASE).toFixed(2)} Tm ${pdfString(str)} Tj`);
    if (n) { const num = (n + 1) + '.'; put(textRight - num.length * CHAR, .5 * PT, num); }
    pg.forEach((l, k) => {
      if (l.t === 'blank' || !l.s) return;
      const top = PAGE.top * PT + k * LH;
      const cfg = l.t === 'more' ? EL.character : EL[l.t];
      const x = cfg.right ? textRight - l.s.length * CHAR : cfg.left * PT;
      put(x, top, l.s);
    });
    pageObj(ops);
  });
  objs[catalog - 1] = `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
  objs[pagesObj - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
  const info = add(`<< /Title ${pdfString(title || 'Screenplay')} /Creator (Screen, lab.wboechler.com) >>`);
  let out = '%PDF-1.4\n%âãÏÓ\n';
  const offsets = objs.map((body, i) => { const at = out.length; out += `${i + 1} 0 obj\n${body}\nendobj\n`; return at; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const bytes = new Uint8Array(out.length);                          // every character is one byte
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
}
function downloadPDF(){
  const pages = paginate(serialize());
  download(fileName('.pdf'), new Blob([makePDF(pages, (hasTitlePage(titlePage) && titlePage.title) || (cur && cur.title), titlePage)], { type: 'application/pdf' }), 'application/pdf');
}

/* ---------- Backups: every script in one .json file, and back again ---------- */
function backupAll(){
  save(); syncIndex();
  const scripts = index.map(m => ({ title: m.title, created: m.created, updated: m.updated, els: (readDoc(m.id) || { els: [] }).els, tp: (readDoc(m.id) || {}).tp }));
  const stamp = new Date().toISOString().slice(0, 10);
  download(`Screen backup ${stamp}.json`, JSON.stringify({ app: 'screen', version: 1, saved: Date.now(), scripts }, null, 1), 'application/json');
}
function restoreBackup(data){
  const list = (data.scripts || []).filter(x => x && Array.isArray(x.els));
  if (!list.length) return flash('No scripts in that backup');
  let first = null;
  for (const x of list){
    const id = newId(), meta = { id, title: uniqueTitle(String(x.title || 'Restored')), created: x.created || Date.now(), updated: x.updated || Date.now(), pages: 1 };
    const tp = x.tp && typeof x.tp === 'object' ? Object.fromEntries(TP_FIELDS.map(k => [k, String(x.tp[k] || '')]).concat([['on', !!x.tp.on]])) : undefined;
    writeDoc(id, { els: x.els.filter(e => Array.isArray(e) && EL[e[0]]).map(e => [e[0], String(e[1] || '')]), tp });
    updIndex(l => l.push(meta)); first = first || id;
  }
  openScript(first, true);
  flash(`Restored ${list.length} ${list.length === 1 ? 'script' : 'scripts'}`, 2400);
}
const fileName = ext => (cur ? cur.title : 'script').replace(/[\\/:*?"<>|]+/g, '').trim().replace(/\s+/g, ' ') + ext;

/* =====================================================================
   10. STORAGE: everything stays in this browser's localStorage
   ===================================================================== */
const store = {
  ok: (() => { try { const k = '__screen'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} },
};
const KEY = { index: 'screen:index', doc: id => 'screen:doc:' + id, last: 'screen:last', prefs: 'screen:prefs' };
let index = store.get(KEY.index) || [];
let mem = {};                                    // fallback when storage is off
let cur = null;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function readDoc(id){ return store.ok ? store.get(KEY.doc(id)) : mem[id]; }
function writeDoc(id, doc){ if (store.ok){ if (!store.set(KEY.doc(id), doc)) flash('Storage is full. Export a copy'); } else mem[id] = doc; }
// The stored list is the source of truth (another tab may have changed it), so every
// change re-reads it, applies fn(list), and writes it back.
function updIndex(fn){
  let list = store.ok ? (store.get(KEY.index) || []) : index;
  if (cur && !list.some(x => x.id === cur.id)) list.unshift(cur);     // keep the open script listed
  if (fn) fn(list);
  index = list; if (store.ok) store.set(KEY.index, list);
  if (cur) cur = list.find(x => x.id === cur.id) || null;
}
const curEntry = l => l.find(x => x.id === cur.id) || {};
function syncIndex(){ if (store.ok) index = store.get(KEY.index) || index; }

let saveTimer = 0;
function save(){
  clearTimeout(saveTimer); if (!cur) return;
  const s = span();
  writeDoc(cur.id, { els: serialize(), c: s ? s.b : null, tp: titlePage || undefined });
  updIndex(l => { const e = curEntry(l); e.updated = Date.now(); e.pages = pageCount; });
}
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); };
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

function openScript(id, focusEnd){
  if (cur) save();
  syncIndex();
  const meta = index.find(x => x.id === id); if (!meta) return;
  const doc = readDoc(id) || { els: [['scene', '']] };
  cur = meta; store.set(KEY.last, id); titlePage = doc.tp || null;
  render(doc.els); undoStack = []; redoStack = []; grouping = false;
  document.title = meta.title + ' · Screen';
  script.focus({ preventScroll: true });
  if (doc.c && !focusEnd) placeAt(doc.c); else { const l = els()[els().length - 1]; place(l, txt(l).length); }
  after(true);
}
function createScript(title, list, extra, tp){
  const id = newId(), meta = { id, title, created: Date.now(), updated: Date.now(), pages: 1, ...(extra || {}) };
  writeDoc(id, { els: list, tp: tp || undefined }); updIndex(l => l.unshift(meta));
  openScript(id, true);
  return meta;
}
function uniqueTitle(t){ let n = t, k = 2; while (index.some(x => x.title === n)) n = t + ' ' + k++; return n; }

function clearScript(){
  checkpoint('struct');
  render([['scene', '']]); place(els()[0], 0);
  if (cur && cur.sample){ const t = uniqueTitle('Untitled'); updIndex(l => { const e = curEntry(l); e.title = t; delete e.sample; }); document.title = t + ' · Screen'; }
  flash('Cleared · ' + MOD + 'Z to undo', 2600);
  after();
}

/* ---------- preferences: theme and focus mode ---------- */
const prefs = Object.assign({ theme: null, focus: false }, store.get(KEY.prefs) || {});
function applyPrefs(){
  if (prefs.theme) document.documentElement.dataset.theme = prefs.theme; else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('focus', !!prefs.focus);
}
const isDark = () => prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function toggleDark(){ prefs.theme = isDark() ? 'light' : 'dark'; store.set(KEY.prefs, prefs); applyPrefs(); flash(isDark() ? 'Dark' : 'Light'); }
function toggleFocus(){ prefs.focus = !prefs.focus; store.set(KEY.prefs, prefs); applyPrefs(); flash(prefs.focus ? 'Focus on' : 'Focus off'); after(true); }

/* =====================================================================
   11. AFTER EVERY CHANGE: current line, indicator, autocomplete, marks, save
   ===================================================================== */
let curEl = null, lastShownType = null, markTimer = 0;
function after(structural){
  trackCurrent();
  updateSuggest();
  clearTimeout(markTimer); markTimer = setTimeout(drawMarks, structural ? 0 : 250);
  saveSoon();
  keepInView();
}
function trackCurrent(){
  const c = caret(), el = c ? c.el : null;
  if (el !== curEl){ if (curEl) curEl.classList.remove('cur'); if (el) el.classList.add('cur'); curEl = el; }
  if (el && typeOf(el) !== lastShownType){ lastShownType = typeOf(el); showType(el); }
}
let flashTimer = 0;
function flash(msg, ms = 1300){
  indicator.textContent = msg; positionIndicator(curEl);
  indicator.classList.add('on'); clearTimeout(flashTimer);
  flashTimer = setTimeout(() => indicator.classList.remove('on'), ms);
}
function showType(el){ flash(EL[typeOf(el)].name); }
function positionIndicator(el){
  if (!el || innerWidth < 900){ indicator.style.top = ''; indicator.style.left = ''; return; }
  const r = el.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
  indicator.style.right = 'auto';
  indicator.style.left = Math.max(8, sr.left - 230) + 'px';
  indicator.style.width = Math.min(200, sr.left - 30) + 'px';
  indicator.style.top = (r.top + (parseFloat(getComputedStyle(el).lineHeight) - 14) / 2) + 'px';
}
function keepInView(){
  const s = getSelection(); if (!s.rangeCount || document.activeElement !== script) return;
  const c = caret(); if (!c) return;
  const r = c.el.getBoundingClientRect();
  if (prefs.focus){                                   // typewriter: keep the line near the middle
    const target = innerHeight * .42, d = r.top - target;
    if (Math.abs(d) > 4) window.scrollBy({ top: d, behavior: 'auto' });
  } else if (r.bottom > innerHeight - 90) window.scrollBy({ top: r.bottom - innerHeight + 160 });
  else if (r.top < 40) window.scrollBy({ top: r.top - 80 });
}
document.addEventListener('selectionchange', () => {
  if (document.activeElement !== script) return;
  trackCurrent();
  if (sug && (!span() || !span().collapsed || caret().el !== sug.el)) sugDismissed = false;
  updateSuggest();
  if (prefs.focus) keepInView();
});
window.addEventListener('resize', () => { clearTimeout(markTimer); markTimer = setTimeout(drawMarks, 120); hideSuggest(); });

// the menu button brightens a little while the mouse moves, then settles back
let summonTimer = 0;
document.addEventListener('mousemove', () => { summon.classList.add('on'); clearTimeout(summonTimer); summonTimer = setTimeout(() => summon.classList.remove('on'), 1600); });
summon.addEventListener('mousedown', e => e.preventDefault());   // keep the caret in the script
summon.addEventListener('click', () => openPalette());

/* =====================================================================
   12. COMMAND PALETTE (Cmd/Ctrl+K)
   ===================================================================== */
let palItems = [], palSel = 0, palMode = 'commands', palPrompt = null, savedCaret = null;
const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };

function commands(){
  const onLab = /wboechler\.com$/.test(location.hostname);
  const elCmds = TAB_ORDER.map(t => ({ label: 'Make this line ' + EL[t].name, hint: '', run: () => { restoreCaret(); const c = caret(); if (c){ checkpoint('struct'); const sh = setType(c.el, t); place(c.el, c.o + sh); after(); } } }));
  return [
    { group: 'Script' },
    { label: 'New script', run: () => askTitle('Name the new script', uniqueTitle('Untitled'), t => createScript(t, [['scene', '']])) },
    { label: 'Rename script', run: () => askTitle('Rename "' + cur.title + '"', cur.title, t => { updIndex(l => { const e = curEntry(l); e.title = t; delete e.sample; }); document.title = t + ' · Screen'; flash('Renamed'); }) },
    { label: 'Duplicate script', run: () => { save(); closePalette(); createScript(uniqueTitle(cur.title + ' copy'), serialize(), null, titlePage && { ...titlePage }); flash('Duplicated'); } },
    { label: 'Delete script', run: () => confirmDelete() },
    { label: 'Edit title page', hint: hasTitlePage(titlePage) ? 'on' : 'off', run: () => openTitlePage() },
    { label: 'Clear script', hint: MOD + '⇧⌫', run: () => { restoreCaret(); clearScript(); } },
    { group: 'Export' },
    { label: 'Download PDF', run: () => downloadPDF() },
    ...(inPreview ? [] : [{ label: 'Print, or save as PDF in Courier Prime', hint: MOD + 'P', run: () => { closePalette(); exportPDF(); } }]),
    { label: 'Download Fountain (.fountain)', run: () => download(fileName('.fountain'), toFountain(serialize(), cur.title, false, titlePage)) },
    { label: 'Download Markdown (.md)', run: () => download(fileName('.md'), toFountain(serialize(), cur.title, true, titlePage)) },
    { label: 'Copy as Fountain', run: () => copyText(toFountain(serialize(), cur.title, false, titlePage)) },
    { group: 'Saving' },
    { label: 'Save', hint: MOD + 'S', run: () => { closePalette(); save(); flash(store.ok ? 'Saved in this browser' : 'Not saving: storage is off'); } },
    { label: 'Back up all scripts (.json)', run: () => backupAll() },
    { label: 'Open a file or restore a backup', run: () => { closePalette(); $('file').click(); } },
    { group: 'Settings' },
    { label: 'Toggle dark mode', hint: isDark() ? 'on' : 'off', run: () => { closePalette(); toggleDark(); } },
    { label: 'Toggle focus mode', hint: prefs.focus ? 'on' : 'off', run: () => { closePalette(); toggleFocus(); } },
    { label: 'Keyboard shortcuts', run: () => showHelp() },
    { group: 'Element' },
    ...elCmds,
    ...(onLab ? [{ group: 'Lab' }, { label: 'Back to lab.wboechler.com', run: () => { save(); location.href = '/'; } }] : []),
  ];
}
function scriptItems(){
  return index.slice().sort((a, b) => b.updated - a.updated).map(s => ({
    label: s.title, hint: (s.id === cur.id ? 'open · ' : '') + (s.pages || 1) + ' pp · ' + ago(s.updated), script: true,
    run: () => { closePalette(); if (s.id !== cur.id) openScript(s.id); else restoreCaret(); },
  }));
}
function buildList(){
  const q = palInput.value.trim().toLowerCase();
  if (palMode === 'prompt'){ palItems = [{ note: true, label: 'Enter to save · Esc to cancel' }]; return; }
  if (palMode === 'help' || palMode === 'confirm') return;
  const words = q.split(/\s+/).filter(Boolean);
  const match = it => !words.length || words.every(w => it.label.toLowerCase().includes(w));
  const scripts = scriptItems().filter(match), cmds = commands();
  const out = [];
  if (scripts.length) out.push({ group: 'Scripts' }, ...(words.length ? scripts : scripts.slice(0, 6)));
  let group = null;
  for (const c of cmds){ if (c.group){ group = c; continue; } if (match(c)){ if (group){ out.push(group); group = null; } out.push(c); } }
  palItems = out;
}
function drawPalette(){
  buildList();
  if (palSel >= palItems.length || palItems[palSel] && (palItems[palSel].group || palItems[palSel].note)) palSel = palItems.findIndex(i => !i.group && !i.note);
  palList.innerHTML = palItems.map((it, i) => it.group ? `<li class="group">${esc(it.group)}</li>`
    : `<li class="${it.note ? 'note' : ''}${it.key ? ' key' : ''}${i === palSel ? ' on' : ''}" data-i="${i}" role="option"><span class="l">${esc(it.label)}</span>${it.hint ? `<span class="h">${esc(it.hint)}</span>` : ''}</li>`).join('');
  const on = palList.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
function openPalette(){
  if (!palette.hidden) return closePalette();
  const s = span(); savedCaret = s ? s.b : savedCaret;
  syncIndex();
  palMode = 'commands'; palInput.value = ''; palSel = 0;
  palInput.placeholder = 'Type a command or a script name';
  palMeta.textContent = cur ? `${cur.title} · ${pageCount} ${pageCount === 1 ? 'page' : 'pages'}${store.ok ? '' : ' · not saving: storage is off'}` : '';
  hideSuggest(); palette.hidden = false; drawPalette(); palInput.focus();
}
function closePalette(){ if (palette.hidden) return; palette.hidden = true; restoreCaret(); }
function restoreCaret(){ palette.hidden = true; script.focus({ preventScroll: true }); if (savedCaret) placeAt(savedCaret); trackCurrent(); }
function askTitle(label, value, done){
  palMode = 'prompt'; palPrompt = done; palMeta.textContent = label; palInput.value = value; palInput.placeholder = 'Script name';
  drawPalette(); palInput.focus(); palInput.select();
}
function confirmDelete(){
  palMode = 'confirm'; palMeta.textContent = 'Delete "' + cur.title + '"? This can’t be undone.'; palInput.value = '';
  palItems = [
    { label: 'Yes, delete it', run: () => {
      const id = cur.id; store.del(KEY.doc(id)); delete mem[id];
      updIndex(l => { const k = l.findIndex(x => x.id === id); if (k >= 0) l.splice(k, 1); }); cur = null;
      if (index.length) openScript(index.sort((a, b) => b.updated - a.updated)[0].id); else createScript('Untitled', [['scene', '']]);
      closePalette(); flash('Deleted');
    } },
    { label: 'Cancel', run: () => { palMode = 'commands'; palMeta.textContent = ''; drawPalette(); } },
  ];
  palSel = 1; drawPalette();
}
function showHelp(){
  palMode = 'help'; palMeta.textContent = 'Keyboard'; palInput.value = '';
  const rows = [
    ['Enter', 'next element: Scene → Action → Character → Dialogue → Character…'],
    ['Enter on an empty line', 'back to Action'],
    ['Tab / Shift+Tab', 'change the current line’s element'],
    ['Shift+Enter', 'new paragraph of the same element'],
    ['(', 'on an empty Dialogue line starts a Parenthetical'],
    ['INT. / EXT.', 'at the start of a line makes a Scene Heading'],
    ['→', 'accept the faint suggestion'],
    ['↑ ↓ then Enter', 'pick from several suggestions'],
    [MOD + 'K', 'commands'],
    [MOD + 'P', 'print, or save as PDF from the print dialog'],
    [MOD + 'S', 'save (it also saves as you type)'],
    [MOD + 'Z / ' + MOD + '⇧Z', 'undo / redo'],
    [MOD + '⇧⌫', 'clear the script'],
  ];
  palItems = rows.map(([k, v]) => ({ note: true, key: true, label: v, hint: k }));
  palSel = -1; drawPalette();
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); flash('Copied as Fountain'); closePalette(); }
  catch (e){ flash('Copy was blocked by the browser'); }
}
palInput.addEventListener('input', () => { if (palMode === 'help' || palMode === 'confirm'){ palMode = 'commands'; palMeta.textContent = ''; } palSel = 0; drawPalette(); });
palInput.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape'){ e.preventDefault(); if (palMode !== 'commands'){ palMode = 'commands'; palMeta.textContent = ''; palInput.value = ''; drawPalette(); } else closePalette(); return; }
  if (palMode === 'prompt'){
    if (k === 'Enter'){ e.preventDefault(); const v = palInput.value.trim(); if (!v) return; const done = palPrompt; palPrompt = null; closePalette(); done(v); }
    return;
  }
  const move = d => { if (!palItems.length) return; let i = palSel; for (let n = 0; n < palItems.length; n++){ i = (i + d + palItems.length) % palItems.length; if (!palItems[i].group && !palItems[i].note) break; } palSel = i; drawPalette(); };
  if (k === 'ArrowDown'){ e.preventDefault(); move(1); }
  else if (k === 'ArrowUp'){ e.preventDefault(); move(-1); }
  else if (k === 'Enter'){ e.preventDefault(); const it = palItems[palSel]; if (it && it.run) it.run(); }
});
palList.addEventListener('mousedown', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return; e.preventDefault();
  const it = palItems[+li.dataset.i]; if (it && it.run) it.run();
});
palette.addEventListener('mousedown', e => { if (e.target === palette){ e.preventDefault(); closePalette(); } });

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); return openPalette(); }
  if (mod && e.key.toLowerCase() === 's'){ e.preventDefault(); save(); return flash(store.ok ? 'Saved in this browser' : 'Not saving: storage is off'); }
  if (mod && e.key.toLowerCase() === 'p'){ buildPrint(); }
});

/* ---------- title page editor ---------- */
const tpEl = $('tp');
function openTitlePage(){
  palette.hidden = true;
  if (!titlePage) titlePage = { title: cur ? cur.title : '', credit: 'Written by', author: '', source: '', date: '', contact: '', on: true };
  for (const k of TP_FIELDS) $('tp-' + k).value = titlePage[k] || '';
  $('tp-on').checked = !!titlePage.on;
  tpEl.hidden = false; $('tp-title').focus();
}
function closeTitlePage(){ if (tpEl.hidden) return; tpEl.hidden = true; save(); restoreCaret(); flash(hasTitlePage(titlePage) ? 'Title page on' : 'No title page'); }
for (const k of TP_FIELDS) $('tp-' + k).addEventListener('input', e => { titlePage[k] = e.target.value; saveSoon(); });
$('tp-on').addEventListener('change', e => { titlePage.on = e.target.checked; saveSoon(); });
$('tp-done').addEventListener('click', closeTitlePage);
tpEl.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.preventDefault(); closeTitlePage(); }
  else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){   // Enter moves down the page
    e.preventDefault(); const order = ['tp-title', 'tp-credit', 'tp-author', 'tp-source', 'tp-contact', 'tp-date'];
    const n = order.indexOf(e.target.id); if (n >= 0 && n < order.length - 1) $(order[n + 1]).focus(); else closeTitlePage();
  }
});

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const text = await f.text();
  if (/\.json$/i.test(f.name) || /^\s*\{/.test(text)){
    try { const data = JSON.parse(text); if (data && data.app === 'screen') return restoreBackup(data); } catch (err) {}
  }
  const parsed = parseText(text);
  if (!parsed.els.length) return flash('Nothing to import in that file');
  createScript(uniqueTitle(parsed.title || f.name.replace(/\.[^.]+$/, '')), parsed.els, null, parsed.tp);
  flash('Imported ' + f.name);
});

/* =====================================================================
   13. FIRST RUN: a sample scene that uses every element
   ===================================================================== */
function sample(){
  return [
    ['scene', 'INT. EMPTY PAGE - NIGHT'],
    ['action', 'Warm paper. One cursor, blinking. Nothing else is here, and nothing else needs to be.'],
    ['character', 'THE WRITER'],
    ['paren', '(to the page)'],
    ['dialogue', 'Where are the buttons?'],
    ['character', 'THE PAGE'],
    ['dialogue', 'Press Enter and I guess what comes next. Tab changes what a line is. ' + MOD + 'K opens everything else.'],
    ['character', 'THE WRITER'],
    ['dialogue', 'And when I’m ready to start?'],
    ['character', 'THE PAGE'],
    ['dialogue', MOD + 'Shift+Backspace. I’ll be gone.'],
    ['transition', 'CUT TO:'],
  ];
}

function boot(){
  applyPrefs();
  // Ask the browser to treat this site's storage as "persistent" so it isn't cleared
  // to free up space. Clearing site data by hand still erases it: back up with Cmd/Ctrl+K.
  try { if (store.ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  if (!index.length) createScript('Sample Scene', sample(), { sample: true });
  else {
    const last = store.get(KEY.last);
    openScript(index.some(x => x.id === last) ? last : index.slice().sort((a, b) => b.updated - a.updated)[0].id);
  }
  if (!store.ok) setTimeout(() => flash('Storage is off here, so nothing will be saved', 3200), 600);
  else setTimeout(() => flash(touchOnly ? 'Tap ☰ for the menu' : MOD + 'K for commands', 2200), 500);
  // fonts can arrive after first paint and nudge line heights
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawMarks());
}
boot();
})();
