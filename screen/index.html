<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Screen: a quiet, keyboard-first screenwriting page by Will Boechler. Tab and Enter do the formatting; prints to an industry-standard PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* =====================================================================
   SCREEN: one sheet of paper, one typeface, nothing else on screen.
   Element indents and widths are NOT set here: they come from the EL table
   in the script (search "MARGIN MATH") and are injected as CSS at boot,
   so screen and print always share one source of truth.
   ===================================================================== */
:root{
  --paper:#f6f3ec;          /* warm off-white */
  --ink:#1d1b18;            /* near-black */
  --faint:rgba(29,27,24,.34);
  --ghost:rgba(29,27,24,.30);
  --rule:rgba(29,27,24,.10);
  --panel:#fbf9f4;
  --panel-line:rgba(29,27,24,.12);
  --hi:rgba(29,27,24,.07);
  --sel:rgba(120,100,60,.18);
  --font:"Courier Prime", "Courier New", Courier, monospace;

  /* --in is one inch of paper on screen. The text column is 6in (the Action width). */
  --in:min(104px, calc((100vw - 32px) / 6));
  --fs:max(14px, calc(var(--in) / 6));   /* 12pt = 1/6in; floors at 14px on phones */
  --lh:calc(var(--fs) * 1.5);            /* screen gets more air than print */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1a18; --ink:#dcd6ca; --faint:rgba(220,214,202,.34); --ghost:rgba(220,214,202,.30);
    --rule:rgba(220,214,202,.10); --panel:#232220; --panel-line:rgba(220,214,202,.12);
    --hi:rgba(220,214,202,.07); --sel:rgba(200,180,130,.22); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1a18; --ink:#dcd6ca; --faint:rgba(220,214,202,.34); --ghost:rgba(220,214,202,.30);
  --rule:rgba(220,214,202,.10); --panel:#232220; --panel-line:rgba(220,214,202,.12);
  --hi:rgba(220,214,202,.07); --sel:rgba(200,180,130,.22); color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  transition:background .3s, color .3s}
::selection{background:var(--sel)}

#sheet{position:relative;width:calc(var(--in) * 6);max-width:100%;margin:0 auto;
  padding-block:16vh 48vh;font-size:var(--fs);line-height:var(--lh)}
#script{outline:none;caret-color:var(--ink);min-height:40vh;overflow-wrap:break-word}
.el{white-space:pre-wrap;min-height:var(--lh);transition:opacity .35s}
.el:first-child{margin-top:0 !important}
.t-scene,.t-character,.t-transition{text-transform:uppercase}
.t-transition{text-align:right}

/* Focus mode: everything but the line you're on steps back */
body.focus .el{opacity:.2}
body.focus .el.cur{opacity:1}
body.focus #marks{opacity:.4}

/* page-break marks, drawn from the same paginator the PDF uses */
#marks{position:absolute;inset:0;pointer-events:none;transition:opacity .35s}
.mark{position:absolute;left:calc(var(--in) * -.35);right:calc(var(--in) * -.35);height:0;border-top:1px dashed var(--rule)}
.mark span{position:absolute;right:0;top:2px;font-size:max(11px, calc(var(--fs) * .7));line-height:1;color:var(--faint)}

/* autocomplete: ghost text after the caret, and a quiet list when there's a choice */
#ghost{position:absolute;pointer-events:none;color:var(--ghost);white-space:pre;text-transform:uppercase;display:none}
#suggest{position:absolute;margin:0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:3px;font-size:max(12px, calc(var(--fs) * .8));line-height:1.6;min-width:12ch;z-index:4;display:none;
  box-shadow:0 6px 24px rgba(0,0,0,.08)}
#suggest li{padding:0 12px;color:var(--faint);text-transform:uppercase;cursor:pointer;white-space:nowrap}
#suggest li.on{color:var(--ink);background:var(--hi)}

/* the one piece of UI: a faint label that names the element, then fades */
#indicator{position:fixed;z-index:3;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  pointer-events:none;opacity:0;transition:opacity .9s ease;white-space:nowrap;text-align:right}
#indicator.on{opacity:1;transition:opacity .15s ease}
@media (max-width:899px){
  #indicator{left:0 !important;right:0;top:auto !important;bottom:calc(14px + env(safe-area-inset-bottom, 0px));text-align:center}
}

/* menu button: a faint ☰ in the top-left that opens the command menu (same as Cmd/Ctrl+K).
   It rests almost invisible and wakes up when the mouse moves or it's hovered. */
#summon{position:fixed;left:max(10px, env(safe-area-inset-left, 0px));top:calc(10px + env(safe-area-inset-top, 0px));z-index:3;
  width:40px;height:40px;display:grid;place-content:center;gap:5px;background:none;border:0;border-radius:4px;padding:0;cursor:pointer;
  opacity:.28;transition:opacity .5s, background .2s}
#summon span{display:block;width:18px;height:1.5px;background:var(--ink)}
#summon.on{opacity:.6}
#summon:hover,#summon:focus-visible{opacity:1;background:var(--hi);outline:none}
@media (hover:none){ #summon{opacity:.55} }

/* command palette */
#palette{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-start;
  padding:14vh max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));background:rgba(0,0,0,.06)}
#palette[hidden]{display:none}
.pal{width:min(560px, 100%);background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;
  box-shadow:0 18px 60px rgba(0,0,0,.16);overflow:hidden;font-size:14px}
#pal-input{display:block;width:100%;border:0;border-bottom:1px solid var(--panel-line);background:transparent;color:var(--ink);
  font:15px/1.4 var(--font);padding:14px 16px;outline:none}
#pal-input::placeholder{color:var(--faint)}
#pal-meta{padding:8px 16px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
#pal-meta:empty{display:none}
#pal-list{list-style:none;margin:0;padding:6px 0;max-height:min(52vh, 440px);overflow-y:auto}
#pal-list li{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:7px 16px;cursor:pointer;line-height:1.35}
#pal-list li .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pal-list li .h{flex:none;color:var(--faint);font-size:12px}
#pal-list li.on{background:var(--hi)}
#pal-list li.group{cursor:default;padding:10px 16px 3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
#pal-list li.note{cursor:default;color:var(--faint)}
#pal-list li.key .l{white-space:normal}

/* title page editor: a sheet of paper laid out like the printed title page */
#tp{position:fixed;inset:0;z-index:9;display:flex;justify-content:center;align-items:center;background:var(--paper);
  padding:calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));overflow-y:auto}
#tp[hidden]{display:none}
.tp-sheet{position:relative;width:min(100%, calc((100vh - 120px) * 8.5 / 11), 680px);aspect-ratio:8.5 / 11;margin:auto;
  border:1px solid var(--panel-line);background:var(--panel);box-shadow:0 10px 40px rgba(0,0,0,.07);
  font-size:clamp(12px, 1.9vh, 15px)}
/* the inner box is the 6x9in text area: 1in top/bottom, 1.5in left, 1in right of an 8.5x11 sheet */
.tp-inner{position:absolute;top:9.09%;bottom:9.09%;left:17.65%;right:11.76%}
.tp-sheet input,.tp-sheet textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:2px;padding:2px 4px;outline:none;width:100%}
.tp-sheet input:focus,.tp-sheet textarea:focus{background:var(--hi)}
.tp-sheet ::placeholder{color:var(--ghost)}
.tp-mid{position:absolute;left:0;right:0;top:33.3%;display:flex;flex-direction:column;align-items:stretch;gap:.3em;text-align:center}
.tp-mid input{text-align:center}
#tp-title{text-transform:uppercase;font-weight:700}
.tp-gap{height:1.4em}
.tp-foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:16px;align-items:flex-end}
#tp-contact{resize:none;min-height:5.4em;line-height:1.35;flex:1}
#tp-date{width:12ch;text-align:right;flex:none}
.tp-bar{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;gap:22px;align-items:center;flex-wrap:wrap;
  padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tp-bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.tp-bar input{accent-color:var(--ink)}
.tp-bar button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);background:none;border:1px solid var(--panel-line);border-radius:3px;padding:6px 10px;cursor:pointer}
.tp-bar button:hover,.tp-bar button:focus-visible{background:var(--hi);outline:none}
@media (max-width:600px){
  .tp-sheet{aspect-ratio:auto;min-height:72vh;padding:24px 16px;display:flex}
  .tp-inner{position:static;display:flex;flex-direction:column;flex:1}
  .tp-mid{position:static;margin-top:16vh} .tp-foot{position:static;margin-top:auto;padding-top:32px}
}

/* print copy of the script: hidden on screen, built by the paginator before printing */
#print{display:none}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

/* =====================================================================
   PRINT: exact US Letter pages. Each .pp is one 8.5x11in sheet; the
   browser's own page margins are zeroed and we place everything ourselves,
   so the PDF matches the paginator line for line.
   ===================================================================== */
@page{size:8.5in 11in;margin:0}
@media print{
  html,body{background:#fff !important;color:#000 !important;padding:0 !important}
  #sheet,#indicator,#summon,#palette,#tp{display:none !important}
  #print{display:block}
  .pp{position:relative;width:8.5in;height:10.99in;overflow:hidden;break-after:page;page-break-after:always;
    font-family:var(--font);font-size:12pt;color:#000}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pb{position:absolute;top:1in;left:1.5in;width:6in}
  .pl{height:calc(1in / 6);line-height:calc(1in / 6);white-space:pre;overflow:visible}
  .pn{position:absolute;top:.5in;right:1in;line-height:calc(1in / 6)}
  .tl{position:absolute;left:1.5in;width:6in;height:calc(1in / 6);line-height:calc(1in / 6);white-space:pre}
}
</style>
<style id="el-css"></style>
</head>
<body>

<main id="sheet">
  <div id="script" contenteditable="true" spellcheck="true" autocapitalize="sentences" role="textbox" aria-multiline="true" aria-label="Screenplay"></div>
  <div id="marks" aria-hidden="true"></div>
  <div id="ghost" aria-hidden="true"></div>
  <ul id="suggest" aria-hidden="true"></ul>
</main>

<div id="indicator" aria-live="polite"></div>
<button id="summon" type="button" aria-label="Menu" title="Menu"><span></span><span></span><span></span></button>

<div id="palette" hidden>
  <div class="pal" role="dialog" aria-label="Commands">
    <input id="pal-input" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command or a script name">
    <div id="pal-meta"></div>
    <ul id="pal-list" role="listbox"></ul>
  </div>
</div>

<div id="tp" hidden role="dialog" aria-label="Title page">
  <div class="tp-bar">
    <label><input type="checkbox" id="tp-on"> Include in PDF and exports</label>
    <button type="button" id="tp-done">Back to script (Esc)</button>
  </div>
  <div class="tp-sheet"><div class="tp-inner">
    <div class="tp-mid">
      <input id="tp-title" placeholder="TITLE" aria-label="Title">
      <div class="tp-gap"></div>
      <input id="tp-credit" placeholder="Written by" aria-label="Credit">
      <input id="tp-author" placeholder="Your name" aria-label="Author">
      <div class="tp-gap"></div>
      <input id="tp-source" placeholder="Based on… (optional)" aria-label="Source">
    </div>
    <div class="tp-foot">
      <textarea id="tp-contact" placeholder="Contact: name, email, phone" aria-label="Contact"></textarea>
      <input id="tp-date" placeholder="Draft date" aria-label="Draft date">
    </div>
  </div></div>
</div>

<div id="print" aria-hidden="true"></div>
<input id="file" type="file" accept=".fountain,.txt,.md,.text,.json,text/plain,application/json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
   1. MARGIN MATH
   ---------------------------------------------------------------------
   Everything is in inches, measured from the LEFT EDGE OF THE PAGE.
   Courier at 12pt has a fixed advance of 7.2pt = 0.1in, so it sets exactly
   10 characters per inch (CPI). That lets the paginator word-wrap every
   element itself and know, to the line, where each page ends.
   12pt type on 12pt leading = 6 lines per inch.

     page              8.5 x 11 in (US Letter)
     margins           left 1.5, right 1.0, top 1.0, bottom 1.0
     text area         6.0in wide (1.5 -> 7.5), 9.0in tall
     lines per page    9.0in x 6 lines/in = 54  (the "~55" rule of thumb)
     page number       top-right, 0.5in from the top, right edge on 7.5in
   ===================================================================== */
const PAGE = { w: 8.5, h: 11, top: 1, bottom: 1, left: 1.5, right: 1 };
const LPI = 6;                                                   // lines per inch
const CPI = 10;                                                  // characters per inch
const LINES_PER_PAGE = Math.round((PAGE.h - PAGE.top - PAGE.bottom) * LPI);   // 54

// Each element: where its text starts (from the page's left edge), how wide it may run,
// how many blank lines go above it, and whether it renders in caps.
//   Action / Scene     1.5in, 6.0in wide  -> 60 characters a line
//   Dialogue           2.5in, 3.3in wide  -> 33 characters
//   Parenthetical      3.1in, 2.0in wide  -> 20 characters (wrapped lines hang 1 char in)
//   Character cue      3.7in, to 7.5in
//   Transition         right-aligned so it ends on the 7.5in mark
// No prototype, so a name like "constructor" in an imported file isn't mistaken for an element type.
const EL = Object.assign(Object.create(null), {
  scene:      { name: 'Scene Heading', left: 1.5, width: 6.0, before: 1, caps: true },   // set before:2 for double-spaced sluglines
  action:     { name: 'Action',        left: 1.5, width: 6.0, before: 1 },
  character:  { name: 'Character',     left: 3.7, width: 3.8, before: 1, caps: true },
  paren:      { name: 'Parenthetical', left: 3.1, width: 2.0, before: 0 },
  dialogue:   { name: 'Dialogue',      left: 2.5, width: 3.3, before: 0 },
  transition: { name: 'Transition',    left: 1.5, width: 6.0, before: 1, caps: true, right: true },
});
const TYPES = Object.keys(EL);

// Inject the element geometry as CSS: on screen in units of --in, in print in real inches.
(function injectGeometry(){
  let css = '';
  for (const t of TYPES){
    const c = EL[t], off = (c.left - PAGE.left).toFixed(2);
    css += `.t-${t}{margin-left:calc(var(--in) * ${off});width:calc(var(--in) * ${c.width});max-width:calc(100% - var(--in) * ${off});margin-top:calc(var(--lh) * ${c.before})}\n`;
    css += `@media print{.k-${t}{margin-left:${off}in;width:${c.width}in${c.right ? ';text-align:right' : ''}}}\n`;
  }
  css += `@media print{.k-more{margin-left:${(EL.character.left - PAGE.left).toFixed(2)}in}}\n`;
  document.getElementById('el-css').textContent = css;
})();

/* =====================================================================
   2. ELEMENT FLOW
   ---------------------------------------------------------------------
   Enter at the end of a line makes the next element:
       Scene Heading -> Action -> Character -> Dialogue -> Character -> ...
       Parenthetical -> Dialogue,  Transition -> Scene Heading
   Enter on an EMPTY line changes that line instead of adding one:
       anything -> Action (an empty Parenthetical goes back to Dialogue).
   Tab / Shift+Tab cycle the current line through TAB_ORDER.
   Shortcuts while typing:
       "INT. " / "EXT. " at the start of Action or Character -> Scene Heading
       "(" on an empty Dialogue line -> Parenthetical
       an all-caps line ending in "TO:" -> Transition when you press Enter
   ===================================================================== */
const NEXT = { scene: 'action', action: 'character', character: 'dialogue', paren: 'dialogue', dialogue: 'character', transition: 'scene' };
const TAB_ORDER = ['scene', 'action', 'character', 'paren', 'dialogue', 'transition'];
const SCENE_RE = /^(INT\.\/EXT\.?|INT\/EXT\.?|I\/E\.?|INT\.|EXT\.|EST\.)\s/i;
const TRANSITIONS = ['CUT TO:', 'FADE OUT.', 'FADE IN:', 'FADE TO BLACK.', 'DISSOLVE TO:', 'SMASH CUT TO:', 'MATCH CUT TO:', 'JUMP CUT TO:', 'BACK TO:', 'INTERCUT WITH:'];
const SCENE_PREFIXES = ['INT. ', 'EXT. ', 'INT./EXT. '];
const TIMES = ['DAY', 'NIGHT', 'CONTINUOUS', 'LATER', 'MORNING', 'EVENING', 'MOMENTS LATER'];

const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = isMac ? '⌘' : 'Ctrl+';

/* ---------- DOM handles ---------- */
const $ = id => document.getElementById(id);
const script = $('script'), sheet = $('sheet'), marks = $('marks'), ghostEl = $('ghost'), suggestEl = $('suggest');
const indicator = $('indicator'), summon = $('summon');
const palette = $('palette'), palInput = $('pal-input'), palList = $('pal-list'), palMeta = $('pal-meta');
const touchOnly = matchMedia('(hover: none)').matches;
summon.title = touchOnly ? 'Menu' : 'Menu (' + (isMac ? '⌘K' : 'Ctrl+K') + ')';

/* =====================================================================
   3. DOCUMENT MODEL
   The DOM is the document: #script holds one <div class="el t-TYPE"> per
   element, each holding a single text node. serialize() turns it into
   [[type, text], ...] for saving, pagination and export.
   ===================================================================== */
const els = () => script.children;
function mk(t, x = ''){ const d = document.createElement('div'); d.className = 'el t-' + t; d.dataset.t = t; setText(d, x); return d; }
function setText(el, x){ if (x) el.textContent = x; else el.innerHTML = '<br>'; }
const txt = el => el.textContent;
const typeOf = el => el.dataset.t;
function isEmpty(el){ const x = txt(el); return typeOf(el) === 'paren' ? x.replace(/[()\s]/g, '') === '' : x.trim() === ''; }
function serialize(){ return Array.from(els(), e => [typeOf(e), txt(e)]); }
function render(list){
  script.replaceChildren(...(list && list.length ? list : [['scene', '']]).map(([t, x]) => mk(EL[t] ? t : 'action', x)));
}
function indexOf(el){ return Array.prototype.indexOf.call(els(), el); }
function elOf(node){
  while (node && node !== script){ if (node.nodeType === 1 && node.parentNode === script) return node; node = node.parentNode; }
  return null;
}

// Change an element's type. Parentheticals wrap/unwrap their ( ). Returns the caret shift.
function setType(el, t){
  const was = typeOf(el); if (was === t) return 0;
  let x = txt(el), shift = 0;
  if (was === 'paren' && /^\(.*\)$/s.test(x)){ x = x.slice(1, -1); shift = -1; }
  if (t === 'paren'){ if (!x.startsWith('(')){ x = '(' + x; shift += 1; } if (!x.endsWith(')')) x += ')'; }
  el.dataset.t = t; el.className = 'el t-' + t + (el.classList.contains('cur') ? ' cur' : '');
  setText(el, x);
  return shift;
}

/* ---------- caret helpers: positions are {i: element index, o: character offset} ---------- */
function offsetIn(el, node, off){ const r = document.createRange(); r.selectNodeContents(el); try { r.setEnd(node, off); } catch (e) { return txt(el).length; } return r.toString().length; }
function posOf(node, off){
  if (node === script){
    const n = els().length; if (!n) return null;
    if (off >= n) return { i: n - 1, o: txt(els()[n - 1]).length };
    return { i: off, o: 0 };
  }
  const el = elOf(node); if (!el) return null;
  return { i: indexOf(el), o: offsetIn(el, node, off) };
}
function span(){
  const s = getSelection(); if (!s.rangeCount) return null;
  const r = s.getRangeAt(0);
  if (!script.contains(r.startContainer) && r.startContainer !== script) return null;
  const a = posOf(r.startContainer, r.startOffset), b = posOf(r.endContainer, r.endOffset);
  if (!a || !b) return null;
  return { a, b, collapsed: r.collapsed || (a.i === b.i && a.o === b.o), multi: a.i !== b.i };
}
function caret(){ const s = span(); if (!s) return null; const el = els()[s.b.i]; return { el, i: s.b.i, o: s.b.o }; }
function place(el, o){
  if (!el) return;
  const n = el.firstChild, r = document.createRange(), s = getSelection();
  if (n && n.nodeType === 3) r.setStart(n, Math.max(0, Math.min(o, n.length))); else r.setStart(el, 0);
  r.collapse(true); s.removeAllRanges(); s.addRange(r);
}
function placeAt(p){ const e = els()[Math.min(p.i, els().length - 1)]; if (e) place(e, p.o); }

// Delete everything in the selection (possibly across elements) and leave the caret at its start.
function removeSpan(sel){
  const A = els()[sel.a.i], B = els()[sel.b.i];
  const keep = txt(A).slice(0, sel.a.o) + txt(B).slice(sel.b.o);
  for (let k = sel.b.i; k > sel.a.i; k--) els()[k].remove();
  setText(A, keep); place(A, sel.a.o);
}
function insertText(str){
  const c = caret(); if (!c) return;
  const x = txt(c.el); setText(c.el, x.slice(0, c.o) + str + x.slice(c.o)); place(c.el, c.o + str.length);
}

// Keep the structure clean: one text node per element, nothing but elements in #script.
function tidy(){
  const c = caret();
  let changed = false;
  for (const node of Array.from(script.childNodes)){
    if (node.nodeType !== 1 || !node.classList.contains('el') || !EL[node.dataset.t]){
      const t = node.nodeType === 1 && EL[node.dataset && node.dataset.t] ? node.dataset.t : 'action';
      const x = node.textContent; if (node.nodeType === 3 && !x.trim()){ node.remove(); changed = true; continue; }
      node.replaceWith(mk(t, x.replace(/\n/g, ' '))); changed = true;
    }
  }
  for (const el of els()){
    const kids = el.childNodes;
    const clean = (kids.length === 1 && kids[0].nodeType === 3) || (kids.length === 1 && kids[0].nodeName === 'BR');
    if (!clean){ setText(el, txt(el).replace(/\n/g, ' ')); changed = true; }
  }
  if (!els().length){ script.appendChild(mk('action')); changed = true; }
  if (changed && c) placeAt({ i: c.i, o: c.o });
}

/* =====================================================================
   4. UNDO / REDO
   Our Enter/Tab handling rewrites the DOM, which breaks the browser's own
   undo, so we keep snapshots. Typing is grouped into ~1.2s runs.
   ===================================================================== */
let undoStack = [], redoStack = [], grouping = false, lastTypeAt = 0;
function snapshot(){ const s = span(); return { els: serialize(), c: s ? s.b : { i: 0, o: 0 } }; }
function checkpoint(kind){
  const now = Date.now();
  if (kind === 'type' && grouping && now - lastTypeAt < 1200){ lastTypeAt = now; return; }
  undoStack.push(snapshot()); if (undoStack.length > 400) undoStack.shift();
  redoStack.length = 0; grouping = kind === 'type'; lastTypeAt = now;
}
function restore(st){ render(st.els); placeAt(st.c); grouping = false; after(true); }
function undo(){ if (!undoStack.length) return flash('Nothing to undo'); redoStack.push(snapshot()); restore(undoStack.pop()); }
function redo(){ if (!redoStack.length) return flash('Nothing to redo'); undoStack.push(snapshot()); restore(redoStack.pop()); }

/* =====================================================================
   5. KEYBOARD: Enter, Tab, Backspace
   ===================================================================== */
function enter(shift){
  let sel = span(); if (!sel) return;
  checkpoint('struct');
  if (!sel.collapsed) removeSpan(sel);
  const c = caret(); if (!c) return;
  const el = c.el, x = txt(el), o = c.o; let t = typeOf(el);
  const tail = x.slice(o);
  const atEnd = tail.trim() === '' || (t === 'paren' && tail === ')');

  if (shift){                           // Shift+Enter: new paragraph of the same type
    if (!atEnd) setText(el, x.slice(0, o));
    const n = mk(t, atEnd ? '' : tail); el.after(n);
    if (t === 'paren'){ setType(n, 'dialogue'); setType(n, 'paren'); }
    place(n, t === 'paren' ? 1 : 0); return after();
  }
  if (isEmpty(el)){                     // empty line: change it instead of adding a new one
    if (t === 'action'){ flash('Action'); return; }
    setType(el, t === 'paren' ? 'dialogue' : 'action'); place(el, 0); return after();
  }
  if (atEnd){
    // commit-time shortcuts: CUT TO: becomes a Transition, INT./EXT. a Scene Heading
    if ((t === 'action' || t === 'character') && looksLikeTransition(x, t)){ setType(el, 'transition'); t = 'transition'; }
    else if ((t === 'action' || t === 'character') && SCENE_RE.test(x + ' ')){ setType(el, 'scene'); t = 'scene'; }
    if (t === 'paren' && !x.trimEnd().endsWith(')')) setText(el, x.trimEnd() + ')');
    if (t !== 'paren' && tail) setText(el, x.slice(0, o));
    const n = mk(NEXT[t]); el.after(n); place(n, 0);
  } else if (o === 0){                  // at the very start: open an Action line above
    const n = mk('action'); el.before(n); place(n, 0);
  } else {                              // mid-line: split, the second half keeps the type
    setText(el, x.slice(0, o)); const n = mk(t, tail); el.after(n); place(n, 0);
  }
  after();
}
function looksLikeTransition(x, t){
  const s = x.trim(), up = s.toUpperCase();
  if (t === 'action' && s !== up) return false;          // action must actually be typed in caps
  return /[A-Z]/.test(up) && (/ TO:$/.test(up) || TRANSITIONS.includes(up));
}
function cycle(dir){
  const c = caret(); if (!c) return;
  checkpoint('struct');
  const t = typeOf(c.el), n = TAB_ORDER[(TAB_ORDER.indexOf(t) + dir + TAB_ORDER.length) % TAB_ORDER.length];
  const shift = setType(c.el, n);
  place(c.el, isEmpty(c.el) ? (n === 'paren' ? 1 : 0) : c.o + shift);
  after();
}
function backspaceAtStart(el){
  const prev = el.previousElementSibling;
  checkpoint('struct');
  if (!prev){ if (typeOf(el) !== 'action' && isEmpty(el)){ setType(el, 'action'); place(el, 0); } return after(); }
  if (isEmpty(el)){ el.remove(); place(prev, txt(prev).length); }
  else if (isEmpty(prev)){ prev.remove(); place(el, 0); }
  else { const pl = txt(prev).length; setText(prev, txt(prev) + txt(el)); el.remove(); place(prev, pl); }
  after();
}
function deleteAtEnd(el){
  const next = el.nextElementSibling; if (!next) return;
  checkpoint('struct');
  const l = txt(el).length;
  if (isEmpty(el)){ el.remove(); place(next, 0); }
  else { setText(el, txt(el) + txt(next)); next.remove(); place(el, l); }
  after();
}

let composing = false;
script.addEventListener('compositionstart', () => { composing = true; });
script.addEventListener('compositionend', () => { composing = false; tidy(); after(); });

script.addEventListener('beforeinput', e => {
  const it = e.inputType;
  if (it === 'historyUndo'){ e.preventDefault(); return undo(); }
  if (it === 'historyRedo'){ e.preventDefault(); return redo(); }
  if (it === 'insertFromDrop' || it === 'deleteByDrag' || /^format/.test(it)){ e.preventDefault(); return; }
  if (it === 'insertParagraph' || it === 'insertLineBreak'){ e.preventDefault(); return enter(it === 'insertLineBreak'); }
  if (composing || it === 'insertCompositionText') return;
  const sel = span(); if (!sel) return;
  if (sel.multi){                         // edits across elements: do them ourselves
    e.preventDefault(); checkpoint('struct'); removeSpan(sel);
    if (it.startsWith('insert') && e.data) insertText(e.data);
    return after();
  }
  const el = els()[sel.a.i], x = txt(el);
  if (sel.collapsed){
    if (/^delete.*Backward$/.test(it)){
      if (sel.a.o === 0){ e.preventDefault(); return backspaceAtStart(el); }
      if (typeOf(el) === 'paren' && x === '()' && sel.a.o === 1){ e.preventDefault(); checkpoint('struct'); setType(el, 'dialogue'); place(el, 0); return after(); }
    }
    if (/^delete.*Forward$/.test(it) && sel.a.o >= x.length){ e.preventDefault(); return deleteAtEnd(el); }
    if (it === 'insertText' && e.data === ')' && typeOf(el) === 'paren' && x[sel.a.o] === ')'){ e.preventDefault(); return place(el, sel.a.o + 1); }
    if (it === 'insertText' && e.data === '(' && typeOf(el) === 'dialogue' && isEmpty(el)){
      e.preventDefault(); checkpoint('struct'); setType(el, 'paren'); place(el, 1); return after();
    }
  }
  checkpoint('type');
});

script.addEventListener('input', () => {
  if (composing) return;
  tidy();
  // typing "INT. " or "EXT. " at the start of Action or Character turns the line into a Scene Heading
  const c = caret();
  if (c && (typeOf(c.el) === 'action' || typeOf(c.el) === 'character') && SCENE_RE.test(txt(c.el)) && c.o === txt(c.el).length){
    setType(c.el, 'scene'); place(c.el, c.o);
  }
  sugDismissed = false;
  after();
});

script.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && !e.altKey && k.toLowerCase() === 'z'){ e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (mod && k.toLowerCase() === 'y'){ e.preventDefault(); return redo(); }
  if (mod && e.shiftKey && (k === 'Backspace' || k === 'Delete')){ e.preventDefault(); return clearScript(); }
  if (mod && ['b', 'i', 'u'].includes(k.toLowerCase())){ e.preventDefault(); return; }

  // autocomplete keys
  if (sug && !e.isComposing){
    if (k === 'ArrowDown' && sug.list.length > 1){ e.preventDefault(); sug.sel = (sug.sel + 1) % sug.list.length; return drawSuggest(); }
    if (k === 'ArrowUp' && sug.list.length > 1){ e.preventDefault(); sug.sel = (sug.sel - 1 + sug.list.length) % sug.list.length; return drawSuggest(); }
    if (k === 'Escape'){ e.preventDefault(); sugDismissed = true; return hideSuggest(); }
    if (k === 'ArrowRight' && !e.shiftKey && !mod){ e.preventDefault(); return accept(false); }
    if (k === 'Enter' && !e.shiftKey && sug.typed){ e.preventDefault(); return accept(true); }
  }
  if (k === 'Tab' && !mod && !e.altKey){ e.preventDefault(); return cycle(e.shiftKey ? -1 : 1); }
  if (k === 'Enter' && !e.isComposing && !mod){ e.preventDefault(); return enter(e.shiftKey); }
});

/* ---------- clipboard: copy/cut as Fountain text, paste with element inference ---------- */
function selectionEls(sel){
  const out = [];
  for (let i = sel.a.i; i <= sel.b.i; i++){
    const e = els()[i]; let x = txt(e);
    if (i === sel.b.i) x = x.slice(0, sel.b.o);
    if (i === sel.a.i) x = x.slice(sel.a.o);
    out.push([typeOf(e), x]);
  }
  return out;
}
script.addEventListener('copy', e => {
  const sel = span(); if (!sel || !sel.multi) return;
  e.preventDefault(); e.clipboardData.setData('text/plain', toFountain(selectionEls(sel)));
});
script.addEventListener('cut', e => {
  const sel = span(); if (!sel || sel.collapsed) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain', sel.multi ? toFountain(selectionEls(sel)) : getSelection().toString());
  checkpoint('struct'); removeSpan(sel); after();
});
script.addEventListener('paste', e => {
  e.preventDefault();
  const raw = (e.clipboardData || window.clipboardData).getData('text/plain'); if (!raw) return;
  checkpoint('struct');
  const sel = span(); if (sel && !sel.collapsed) removeSpan(sel);
  if (!/\n/.test(raw.trim())){ insertText(raw.replace(/\s+/g, ' ')); return after(); }
  insertEls(parseText(raw).els);
  after();
});
script.addEventListener('drop', e => e.preventDefault());

function insertEls(list){
  if (!list.length) return;
  const c = caret(); if (!c) return;
  const el = c.el, x = txt(el), left = x.slice(0, c.o), right = x.slice(c.o);
  const nodes = list.map(([t, s]) => mk(t, s));
  if (!left.trim()) el.before(...nodes); else { setText(el, left); el.after(...nodes); }
  const last = nodes[nodes.length - 1];
  if (!left.trim() && !right.trim()) el.remove();
  else if (left.trim() && right.trim()) last.after(mk(typeOf(el), right));
  else if (!left.trim()) setText(el, right);
  place(last, txt(last).length);
}

/* =====================================================================
   6. AUTOCOMPLETE
   Scene Headings: INT. / EXT. / INT./EXT., then locations already used,
   then DAY / NIGHT / CONTINUOUS... after " - ".
   Character: names already in the script. On an empty cue it offers the
   person who spoke before the last speaker, so two-hander scenes flow.
   Right Arrow accepts the faint ghost text. Enter accepts when you've
   typed part of it (and moves on to Dialogue for a character name).
   Up/Down choose when there's more than one. Esc dismisses.
   ===================================================================== */
let sug = null, sugDismissed = false;
function baseName(s){ return s.toUpperCase().replace(/\(.*?\)/g, '').replace(/\^\s*$/, '').trim(); }
function characterNames(skip){
  const count = new Map();
  for (const e of els()){ if (e === skip || typeOf(e) !== 'character') continue; const n = baseName(txt(e)); if (n) count.set(n, (count.get(n) || 0) + 1); }
  return [...count.entries()].sort((a, b) => b[1] - a[1]).map(a => a[0]);
}
function nextSpeaker(el){            // who probably talks next: the speaker before the last one
  let last = null;
  for (let e = el.previousElementSibling; e; e = e.previousElementSibling){
    const t = typeOf(e); if (t === 'scene') break;
    if (t !== 'character') continue;
    const n = baseName(txt(e)); if (!n) continue;
    if (!last) last = n; else if (n !== last) return n;
  }
  return null;
}
function sceneLocations(skip){
  const seen = [];
  for (const e of els()){
    if (e === skip || typeOf(e) !== 'scene') continue;
    const m = txt(e).toUpperCase().match(SCENE_RE); if (!m) continue;
    const loc = txt(e).toUpperCase().slice(m[0].length).split(' - ')[0].trim();
    if (loc && !seen.includes(loc)) seen.push(loc);
  }
  return seen;
}
function candidates(el){
  const t = typeOf(el), x = txt(el), X = x.toUpperCase();
  if (t === 'character'){
    if (!x.trim()){ const n = nextSpeaker(el); return n ? [n] : []; }
    return characterNames(el).filter(n => n.startsWith(X) && n !== X);
  }
  if (t === 'scene'){
    const m = X.match(/^(INT\.\/EXT\.|INT\.|EXT\.|EST\.|I\/E\.?)\s+/);
    if (!m) return SCENE_PREFIXES.filter(p => p.startsWith(X) && p !== X);
    const rest = X.slice(m[0].length), head = X.slice(0, m[0].length), dash = rest.lastIndexOf(' - ');
    if (dash < 0) return sceneLocations(el).filter(l => l.startsWith(rest) && l !== rest).map(l => head + l);
    const time = rest.slice(dash + 3), pre = head + rest.slice(0, dash + 3);
    return TIMES.filter(tm => tm.startsWith(time) && tm !== time).map(tm => pre + tm);
  }
  if (t === 'transition'){ if (!x.trim()) return []; return TRANSITIONS.filter(tr => tr.startsWith(X) && tr !== X); }
  return [];
}
function updateSuggest(){
  const s = span();
  if (!s || !s.collapsed || sugDismissed || palette.hidden === false){ return hideSuggest(); }
  const el = els()[s.b.i]; if (!el || s.b.o !== txt(el).length){ return hideSuggest(); }
  const list = candidates(el).slice(0, 6);
  if (!list.length) return hideSuggest();
  const keep = sug && sug.el === el ? list.indexOf(sug.list[sug.sel]) : -1;
  sug = { el, list, sel: keep >= 0 ? keep : 0, typed: txt(el).trim() !== '' };
  drawSuggest();
}
function caretRect(el){
  const n = el.firstChild, sr = sheet.getBoundingClientRect();
  if (n && n.nodeType === 3 && n.length){
    const r = document.createRange(); r.setStart(n, n.length); r.collapse(true);
    let b = r.getBoundingClientRect();
    if (!b.height){ r.setStart(n, n.length - 1); r.setEnd(n, n.length); const q = r.getBoundingClientRect(); b = { left: q.right, top: q.top, bottom: q.bottom, height: q.height }; }
    return { x: b.left - sr.left, y: b.top - sr.top, h: b.height || b.bottom - b.top };
  }
  const b = el.getBoundingClientRect();
  return { x: b.left - sr.left, y: b.top - sr.top, h: b.height };
}
function drawSuggest(){
  if (!sug) return hideSuggest();
  const el = sug.el, x = txt(el), pick = sug.list[sug.sel], r = caretRect(el);
  const lineH = parseFloat(getComputedStyle(el).lineHeight) || r.h;
  // ghost: only when the choice continues what you typed and the line isn't right-aligned
  if (typeOf(el) !== 'transition' && pick.toUpperCase().startsWith(x.toUpperCase())){
    ghostEl.textContent = pick.slice(x.length); ghostEl.style.display = 'block';
    ghostEl.style.left = r.x + 'px'; ghostEl.style.top = (r.y + (r.h - lineH) / 2) + 'px'; ghostEl.style.lineHeight = lineH + 'px';
  } else ghostEl.style.display = 'none';
  if (sug.list.length > 1 || typeOf(el) === 'transition'){
    suggestEl.innerHTML = sug.list.map((s, i) => `<li class="${i === sug.sel ? 'on' : ''}" data-i="${i}">${esc(s.trim())}</li>`).join('');
    const elLeft = el.getBoundingClientRect().left - sheet.getBoundingClientRect().left;
    suggestEl.style.display = 'block'; suggestEl.style.left = elLeft + 'px'; suggestEl.style.top = (r.y + lineH + 4) + 'px';
  } else suggestEl.style.display = 'none';
}
function hideSuggest(){ sug = null; ghostEl.style.display = 'none'; suggestEl.style.display = 'none'; }
function accept(andEnter){
  if (!sug) return;
  const el = sug.el, pick = sug.list[sug.sel];
  checkpoint('struct');
  setText(el, pick); place(el, pick.length); hideSuggest();
  if (andEnter && typeOf(el) === 'character') return enter(false);
  after();
}
suggestEl.addEventListener('mousedown', e => {
  const li = e.target.closest('li'); if (!li || !sug) return;
  e.preventDefault(); sug.sel = +li.dataset.i; accept(false);
});

/* =====================================================================
   7. PAGINATION
   Wraps every element at its exact character width, then fills 54-line
   pages with these rules:
     - blank lines above an element are dropped at the top of a page
     - a Scene Heading never sits alone at the bottom of a page
     - a Character cue never leaves its Dialogue: the cue, any opening
       Parenthetical and at least 2 lines of dialogue stay together
     - long speeches split between dialogue lines with (MORE) at the
       bottom and "NAME (CONT'D)" at the top of the next page
     - Action paragraphs split only with 2+ lines on each side
   The same result draws the faint page marks on screen and builds the PDF.
   ===================================================================== */
const MIN_DIALOGUE_BEFORE_BREAK = 2, MIN_AFTER_BREAK = 2, MIN_ACTION_SPLIT = 2;

function wrap(text, t){
  const c = EL[t], width = Math.round(c.width * CPI);
  const words = text.split(' '), lines = [];
  let line = '', w = width;
  const push = () => { lines.push(line); line = ''; if (t === 'paren') w = width - 1; };   // parentheticals hang one space
  for (let word of words){
    while (word.length > w){                     // a word longer than the line: hard-break it
      if (line){ push(); }
      lines.push(word.slice(0, w)); word = word.slice(w); if (t === 'paren') w = width - 1;
    }
    if (!line) line = word;
    else if (line.length + 1 + word.length <= w) line += ' ' + word;
    else { push(); line = word; }
  }
  if (line || !lines.length) lines.push(line);
  return t === 'paren' ? lines.map((l, k) => k ? ' ' + l : l) : lines;
}
function printable(t, x){ x = x.replace(/\s+/g, ' ').trim(); return EL[t].caps ? x.toUpperCase() : x; }

function paginate(list){
  // 1. blocks with wrapped lines; empty elements take no space
  const blocks = [];
  list.forEach(([t, x], i) => { const s = printable(t, x); if (s && (t !== 'paren' || s.replace(/[()\s]/g, ''))) blocks.push({ t, i, lines: wrap(s, t) }); });
  // 2. units: a speech is a cue plus the parentheticals and dialogue under it
  const units = [];
  for (let k = 0; k < blocks.length; k++){
    const b = blocks[k];
    if (b.t === 'character' || b.t === 'paren' || b.t === 'dialogue'){
      const sp = { kind: 'speech', name: b.t === 'character' ? b.lines.join(' ') : null, lines: [] };
      let j = k;
      do {
        const bj = blocks[j];
        bj.lines.forEach((s, l) => sp.lines.push({ t: bj.t, s, src: { i: bj.i, l } }));
        j++;
      } while (j < blocks.length && (blocks[j].t === 'paren' || blocks[j].t === 'dialogue'));
      units.push(sp); k = j - 1;
    } else units.push({ kind: 'block', t: b.t, lines: b.lines.map((s, l) => ({ t: b.t, s, src: { i: b.i, l } })) });
  }
  // 3. fill pages
  const pages = []; let page = [];
  const used = () => page.length;
  const room = () => LINES_PER_PAGE - used();
  const gapFor = t => used() === 0 ? 0 : EL[t].before;
  const newPage = () => { if (page.length) pages.push(page); page = []; };
  const add = (lines, t) => { const g = gapFor(t); for (let n = 0; n < g; n++) page.push({ t: 'blank' }); page.push(...lines); };
  // the least of a unit that must land on the same page as a scene heading before it
  const headOf = u => u.kind === 'speech'
    ? Math.min(u.lines.length, 1 + u.lines.slice(1).findIndex(l => l.t === 'dialogue') + 1 || u.lines.length) + 1
    : Math.min(u.lines.length, 2) + EL[u.t].before;
  const sentenceEnd = s => /[.!?…]["'”’)]*$/.test(s) || /--$/.test(s);

  function placeSpeech(lines, name){
    const g = gapFor(lines[0].t), r = room() - g;
    if (lines.length <= r) return add(lines, lines[0].t);
    // find a split point k (lines kept here), leaving one line for (MORE)
    let best = -1;
    for (let k = Math.min(lines.length - MIN_AFTER_BREAK, r - 1); k > 0; k--){
      if (lines[k - 1].t !== 'dialogue') continue;
      const dlg = lines.slice(0, k).filter(l => l.t === 'dialogue').length;
      if (dlg < MIN_DIALOGUE_BEFORE_BREAK) break;
      if (best < 0) best = k;
      if (sentenceEnd(lines[k - 1].s)){ best = k; break; }
      if (best - k > 3) break;                  // don't give up more than a few lines hunting for a full stop
    }
    if (best > 0 && name){
      add(lines.slice(0, best), lines[0].t);
      page.push({ t: 'more', s: '(MORE)' });
      newPage();
      const cont = /\(CONT['’]D\)/i.test(name) ? name : name + " (CONT'D)";
      return placeSpeech([{ t: 'character', s: cont, src: lines[best].src }, ...lines.slice(best)], name);
    }
    if (used() === 0){                           // taller than a whole page and no clean split: cut it
      const k = Math.max(1, r - 1); add(lines.slice(0, k), lines[0].t); newPage(); return placeSpeech(lines.slice(k), name);
    }
    newPage(); placeSpeech(lines, name);
  }
  function placeBlock(u, next){
    const lines = u.lines, g = gapFor(u.t), r = room() - g;
    let need = lines.length;
    if (u.t === 'scene' && next) need += headOf(next);          // keep the heading with what follows
    if (need <= r) return add(lines, u.t);
    if (u.t === 'action' && r >= MIN_ACTION_SPLIT && lines.length - r >= MIN_ACTION_SPLIT){
      let k = r; for (let q = r; q >= Math.max(MIN_ACTION_SPLIT, r - 3); q--) if (sentenceEnd(lines[q - 1].s)){ k = q; break; }
      add(lines.slice(0, k), u.t); newPage(); return placeBlock({ ...u, lines: lines.slice(k) }, next);
    }
    if (used() === 0){                           // a block taller than the page
      add(lines.slice(0, r), u.t); newPage(); return placeBlock({ ...u, lines: lines.slice(r) }, next);
    }
    newPage(); placeBlock(u, next);
  }
  const placeUnit = (u, next) => u.kind === 'speech' ? placeSpeech(u.lines, u.name) : placeBlock(u, next);
  // Place unit k (and, for a scene heading, what follows it). Returns the next unplaced index.
  // If a heading still ends up alone at the bottom of a page, because the unit after it
  // moved on, rewind and push the heading over with it.
  function placeFrom(k){
    const u = units[k], next = units[k + 1];
    if (!(u.kind === 'block' && u.t === 'scene' && next && used() > 0)){ placeUnit(u, next); return k + 1; }
    const keepPages = pages.length, keepPage = page.slice();
    placeBlock(u, next); let j = placeFrom(k + 1);
    const done = pages[keepPages], lastLine = done && [...done].reverse().find(l => l.t !== 'blank');
    if (lastLine && lastLine.t === 'scene' && lastLine.src.i === u.lines[0].src.i){
      pages.length = keepPages; page = keepPage; newPage(); placeBlock(u, next); j = placeFrom(k + 1);
    }
    return j;
  }
  for (let k = 0; k < units.length;) k = placeFrom(k);
  newPage();
  if (!pages.length) pages.push([]);
  return pages;
}

/* ---------- title page ----------
   Laid out on the same 54-row grid as script pages (row 0 = 1in from the top):
   the title centred at row 18 (4in down), the credit 4 rows below, the author
   2 below that, the source 3 further; contact bottom-left and the draft date
   bottom-right, both ending on the last row. Returns [{row, s, align}]. */
let titlePage = null;                       // the open script's title page
const TP_FIELDS = ['title', 'credit', 'author', 'source', 'date', 'contact'];
const hasTitlePage = tp => !!(tp && tp.on && TP_FIELDS.some(k => (tp[k] || '').trim()));
function titlePageLines(tp){
  const out = [], W = Math.round(EL.action.width * CPI);
  const center = (row, text, caps) => { wrap(printable('action', caps ? text.toUpperCase() : text), 'action').forEach((l, k) => out.push({ row: row + k, s: l.slice(0, W), align: 'center' })); return row + Math.max(1, wrap(text, 'action').length); };
  let row = 18;
  if ((tp.title || '').trim()) row = center(row, tp.title, true);
  row += 3;
  if ((tp.credit || '').trim()) row = center(row, tp.credit) + 1;
  if ((tp.author || '').trim()) row = center(row, tp.author);
  row += 2;
  if ((tp.source || '').trim()) center(row, tp.source);
  const contact = (tp.contact || '').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8);
  const last = LINES_PER_PAGE - 1;
  contact.forEach((c, k) => out.push({ row: last - contact.length + 1 + k, s: c.slice(0, 40), align: 'left' }));
  if ((tp.date || '').trim()) out.push({ row: last, s: tp.date.trim().slice(0, 24), align: 'right' });
  return out;
}

/* ---------- on-screen page marks ---------- */
let pageCount = 1;
function drawMarks(){
  const pages = paginate(serialize());
  pageCount = pages.length;
  const list = els(), html = [];
  for (let p = 1; p < pages.length; p++){
    const first = pages[p].find(l => l.src); if (!first) continue;
    const el = list[first.src.i]; if (!el) continue;
    const lh = parseFloat(getComputedStyle(el).lineHeight) || 24;
    const y = el.offsetTop + first.src.l * lh - Math.max(4, (parseFloat(getComputedStyle(el).marginTop) || lh) / 2);
    html.push(`<div class="mark" style="top:${Math.round(y)}px"><span>${p + 1}.</span></div>`);
  }
  marks.innerHTML = html.join('');
}
